<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse · Messenger</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d0e12;
    --surface: #15171e;
    --surface2: #1c1f2a;
    --surface3: #232738;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --accent-glow: rgba(108,99,255,0.25);
    --text: #f0f0f5;
    --text-muted: #8b8fa8;
    --text-faint: #454866;
    --bubble-me: #6c63ff;
    --bubble-them: #1c1f2a;
    --online: #22d3a0;
    --danger: #f97066;
    --radius: 18px;
    --radius-sm: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 44px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.1);
    animation: slideUp 0.5s cubic-bezier(0.23,1,0.32,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-logo {
    font-family: 'Syne', sans-serif;
    font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .auth-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 36px; }
  .auth-tabs {
    display: flex; gap: 4px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 4px; margin-bottom: 28px;
  }
  .auth-tab {
    flex: 1; padding: 9px;
    text-align: center; font-size: 14px; font-weight: 500;
    border-radius: 8px; cursor: pointer;
    color: var(--text-muted); transition: all 0.2s;
    border: none; background: none;
  }
  .auth-tab.active {
    background: var(--accent);
    color: #fff;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 15px; color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--text-faint); }
  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #6c63ff, #8b84ff);
    border: none; border-radius: var(--radius-sm);
    color: #fff; font-size: 15px; font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; margin-top: 8px;
    transition: all 0.2s; position: relative; overflow: hidden;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .auth-error {
    color: var(--danger); font-size: 13px;
    text-align: center; margin-top: 12px;
    min-height: 18px;
  }

  /* ── APP LAYOUT ── */
  #app { display: flex; width: 100%; height: 100%; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 320px; min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    height: 100%;
  }
  .sidebar-header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .app-name {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; font-size: 18px;
  }
  .icon-btn:hover { background: var(--surface3); color: var(--text); }
  .search-box {
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px 10px 38px;
    font-size: 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none; transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); font-size: 15px; pointer-events: none;
  }

  /* User profile bar */
  .user-profile-bar {
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
    flex-shrink: 0; text-transform: uppercase;
    position: relative;
  }
  .avatar.online::after {
    content: '';
    position: absolute; bottom: 1px; right: 1px;
    width: 9px; height: 9px;
    border-radius: 50%; background: var(--online);
    border: 2px solid var(--surface);
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-weight: 600; font-size: 14px; truncate }
  .user-status { font-size: 12px; color: var(--online); }
  .logout-btn {
    background: none; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 18px; padding: 4px;
    transition: color 0.2s;
  }
  .logout-btn:hover { color: var(--danger); }

  /* Contacts list */
  .contacts-label {
    padding: 12px 20px 6px;
    font-size: 11px; font-weight: 600;
    color: var(--text-faint); letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .contacts-list { flex: 1; overflow-y: auto; padding: 4px 10px; }
  .contacts-list::-webkit-scrollbar { width: 4px; }
  .contacts-list::-webkit-scrollbar-track { background: transparent; }
  .contacts-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .contact-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 14px;
    cursor: pointer; transition: background 0.15s;
    margin-bottom: 2px; position: relative;
  }
  .contact-item:hover { background: var(--surface2); }
  .contact-item.active { background: var(--surface3); }
  .contact-meta { flex: 1; min-width: 0; }
  .contact-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
  .contact-preview {
    font-size: 12px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-time { font-size: 11px; color: var(--text-faint); margin-bottom: auto; white-space: nowrap; }
  .unread-badge {
    background: var(--accent);
    color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 10px; padding: 1px 6px;
    min-width: 18px; text-align: center;
  }

  /* ── NEW CHAT MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 28px;
    width: 100%; max-width: 380px;
    animation: slideUp 0.3s cubic-bezier(0.23,1,0.32,1);
  }
  .modal h3 { font-family: 'Syne', sans-serif; font-size: 18px; margin-bottom: 20px; }
  .modal .field input { margin-top: 0; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-secondary {
    flex: 1; padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text); font-size: 14px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-secondary:hover { background: var(--surface3); }
  .modal-actions .btn-primary { flex: 1; padding: 12px; margin: 0; }

  /* ── CHAT AREA ── */
  .chat-area {
    flex: 1; display: flex; flex-direction: column;
    height: 100%; background: var(--bg); min-width: 0; overflow: hidden;
  }
  #chat-view {
    flex: 1; min-width: 0; overflow: hidden;
  }
  .chat-placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-faint); gap: 12px;
  }
  .chat-placeholder-icon { font-size: 60px; opacity: 0.4; }
  .chat-placeholder h2 { font-family: 'Syne', sans-serif; font-size: 22px; color: var(--text-muted); }
  .chat-placeholder p { font-size: 14px; }

  /* Chat header */
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    background: var(--surface);
  }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-weight: 600; font-size: 16px; }
  .chat-header-status { font-size: 12px; color: var(--text-muted); }
  .chat-header-actions { display: flex; gap: 8px; }

  /* Messages */
  .messages-area {
    flex: 1; overflow-y: auto;
    padding: 24px 28px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .msg-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 12px; }
  .msg-group.me { align-items: flex-end; }
  .msg-group.them { align-items: flex-start; }

  .msg-sender-name {
    font-size: 11px; font-weight: 600;
    color: var(--text-faint); margin-bottom: 4px;
    padding: 0 12px;
  }

  .bubble {
    max-width: 65%; padding: 11px 16px;
    border-radius: 20px;
    font-size: 14.5px; line-height: 1.5;
    position: relative; animation: bubblePop 0.25s cubic-bezier(0.34,1.56,0.64,1);
    word-break: break-word;
  }
  @keyframes bubblePop {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .me .bubble {
    background: var(--bubble-me);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .them .bubble {
    background: var(--bubble-them);
    color: var(--text);
    border-bottom-left-radius: 6px;
    border: 1px solid var(--border);
  }
  .bubble-time {
    font-size: 10px; margin-top: 4px;
    color: var(--text-faint); padding: 0 4px;
  }
  .me .bubble-time { text-align: right; }

  /* Image bubble */
  .bubble.image-bubble {
    padding: 4px; background: var(--surface2);
    border-radius: 16px; overflow: hidden; max-width: 280px;
    border: 1px solid var(--border);
  }
  .bubble.image-bubble img {
    width: 100%; display: block;
    border-radius: 13px; cursor: pointer;
    transition: transform 0.2s;
  }
  .bubble.image-bubble img:hover { transform: scale(1.02); }

  /* Date divider */
  .date-divider {
    text-align: center; font-size: 11px;
    color: var(--text-faint); margin: 12px 0;
    display: flex; align-items: center; gap: 10px;
  }
  .date-divider::before, .date-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 16px;
    background: var(--bubble-them);
    border: 1px solid var(--border);
    border-radius: 20px; border-bottom-left-radius: 6px;
    width: fit-content;
  }
  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: flex-end; gap: 12px;
  }
  .input-area textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14.5px; color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none; resize: none;
    max-height: 120px; min-height: 46px;
    line-height: 1.5; transition: border-color 0.2s;
  }
  .input-area textarea:focus { border-color: var(--accent); }
  .input-area textarea::placeholder { color: var(--text-faint); }
  .attach-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; font-size: 19px;
  }
  .attach-btn:hover { background: var(--surface3); color: var(--text); }
  .send-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px;
    background: var(--accent);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; font-size: 19px;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #file-input { display: none; }

  /* Image preview */
  .image-preview-bar {
    padding: 10px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: none;
    gap: 10px; align-items: center;
  }
  .image-preview-bar.show { display: flex; }
  .preview-thumb {
    width: 52px; height: 52px; border-radius: 10px;
    object-fit: cover; border: 2px solid var(--accent);
  }
  .preview-info { flex: 1; font-size: 13px; color: var(--text-muted); }
  .preview-remove {
    background: none; border: none;
    color: var(--danger); font-size: 20px;
    cursor: pointer; line-height: 1;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.2s;
  }
  .lightbox img {
    max-width: 90vw; max-height: 90vh;
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  }
  .lightbox-close {
    position: absolute; top: 20px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 22px;
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.2s;
  }
  .lightbox-close:hover { background: var(--danger); border-color: var(--danger); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 18px;
    font-size: 14px; color: var(--text);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    animation: slideUp 0.3s cubic-bezier(0.23,1,0.32,1);
    z-index: 400; display: flex; align-items: center; gap: 8px;
  }
  .toast.success { border-color: var(--online); }
  .toast.error { border-color: var(--danger); }

  /* Scrollbar for entire messages */
  * { scrollbar-width: thin; scrollbar-color: var(--surface3) transparent; }

  /* Responsive */
  @media (max-width: 680px) {
    .sidebar { width: 100%; min-width: unset; position: absolute; z-index: 10; left: 0; top: 0; bottom: 0; }
    .sidebar.hidden { display: none; }
    .chat-area { width: 100%; }
    #app { position: relative; }
    .sidebar-header { padding: 16px 14px; }
    .contacts-list { padding: 4px 8px; }
    .messages-area { padding: 16px 12px; }
    .input-area { padding: 12px; }
    .bubble { max-width: 85%; }
    .back-btn { display: flex !important; }
  }
  .back-btn { display: none; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Pulse</div>
    <p class="auth-sub">Your next-gen messenger</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
    </div>
    <div id="signup-form" style="display:none">
      <div class="field">
        <label>Display Name</label>
        <input type="text" id="signup-name" placeholder="Your name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters" />
      </div>
      <button class="btn-primary" onclick="doSignup()">Create Account</button>
    </div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-top">
        <span class="app-name">Pulse</span>
        <div class="header-actions">
          <button class="icon-btn" title="New Chat" onclick="openNewChat()">✏️</button>
        </div>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search conversations…" oninput="filterContacts(this.value)" />
      </div>
    </div>
    <div class="contacts-label">Messages</div>
    <div class="contacts-list" id="contacts-list">
      <div style="text-align:center;padding:30px;color:var(--text-faint);font-size:13px;">
        No conversations yet.<br>Start a new chat ✏️
      </div>
    </div>
    <div class="user-profile-bar">
      <div class="avatar online" id="my-avatar"></div>
      <div class="user-info">
        <div class="user-name" id="my-name"></div>
        <div class="user-status">● Active now</div>
      </div>
      <button class="logout-btn" title="Sign out" onclick="doLogout()">⏻</button>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chat-area">
    <div class="chat-placeholder" id="chat-placeholder">
      <div class="chat-placeholder-icon">💬</div>
      <h2>Start a conversation</h2>
      <p>Select a chat or create a new one</p>
    </div>
    <div id="chat-view" style="display:none;flex-direction:column;flex:1;height:100%;min-width:0">
      <div class="chat-header">
        <button class="back-btn icon-btn" onclick="goBackToSidebar()" title="Back">←</button>
        <div class="avatar" id="chat-avatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-name"></div>
          <div class="chat-header-status" id="chat-status">Tap to view info</div>
        </div>
      </div>
      <div class="messages-area" id="messages-area"></div>
      <div class="image-preview-bar" id="image-preview-bar">

<script>
const SUPABASE_URL = 'https://muyevssqiuvhcozgxtlp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11eWV2c3NxaXV2aGNvemd4dGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTE4NTQsImV4cCI6MjA5Mzk4Nzg1NH0.jzN6V1UArKq5epxK3tTXuo1cGukH5oKD9qAi1FQWGUU';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentConversation = null;
let conversations = [];
let messageSubscription = null;
let selectedFile = null;
let selectedFileDataURL = null;

// ── INIT ──
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { currentUser = session.user; await enterApp(); }

// ── AUTH ──
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i)=>{
    t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1));
  });
  document.getElementById('login-form').style.display = tab==='login'?'':'none';
  document.getElementById('signup-form').style.display = tab==='signup'?'':'none';
  document.getElementById('auth-error').textContent = '';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pwd   = document.getElementById('login-password').value;
  if (!email || !pwd) return setAuthError('Please fill all fields.');
  setAuthError('Signing in…');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) return setAuthError(error.message);
  currentUser = data.user;
  enterApp();
}

async function doSignup() {
  const name  = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pwd   = document.getElementById('signup-password').value;
  if (!name || !email || !pwd) return setAuthError('Please fill all fields.');
  if (pwd.length < 6) return setAuthError('Password must be at least 6 characters.');
  setAuthError('Creating account…');
  const { data, error } = await sb.auth.signUp({
    email, password: pwd,
    options: { data: { display_name: name } }
  });
  if (error) return setAuthError(error.message);
  currentUser = data.user;
  // upsert profile
  await sb.from('profiles').upsert({ id: currentUser.id, email, display_name: name });
  setAuthError('✅ Account created! Signing you in…');
  setTimeout(() => enterApp(), 800);
}

function setAuthError(msg) { document.getElementById('auth-error').textContent = msg; }

async function doLogout() {
  await sb.auth.signOut();
  currentUser = null;
  currentConversation = null;
  if (messageSubscription) { sb.removeChannel(messageSubscription); messageSubscription = null; }
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
}

// ── APP ENTER ──
async function enterApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const meta = currentUser.user_metadata || {};
  const name = meta.display_name || currentUser.email.split('@')[0];
  document.getElementById('my-name').textContent = name;
  document.getElementById('my-avatar').textContent = name[0].toUpperCase();
  // Ensure profile exists
  await sb.from('profiles').upsert({ id: currentUser.id, email: currentUser.email, display_name: name });
  await setupTables();
  await loadConversations();
  subscribeToAllMessages();
}

// ── ENSURE TABLES EXIST (graceful) ──
async function setupTables() {
  // We try to create tables via RPC or just let queries fail gracefully
  // Tables needed: profiles(id,email,display_name), conversations(id,created_at,participant1,participant2), messages(id,conversation_id,sender_id,content,image_url,created_at)
}

// ── CONVERSATIONS ──
async function loadConversations() {
  const uid = currentUser.id;
  const { data, error } = await sb.from('conversations')
    .select('*')
    .or(`participant1.eq.${uid},participant2.eq.${uid}`)
    .order('updated_at', { ascending: false });

  if (error) {
    // Table might not exist yet — show hint
    console.warn('conversations table error:', error.message);
    showSetupHint();
    return;
  }

  conversations = data || [];
  await renderConversations(conversations);
}

function showSetupHint() {
  document.getElementById('contacts-list').innerHTML = `
    <div style="padding:16px;font-size:12px;color:var(--text-faint);line-height:1.6;text-align:center">
      ⚠️ Database tables not set up.<br>
      Please run the SQL setup in your Supabase dashboard.<br><br>
      <span style="color:var(--accent);cursor:pointer" onclick="showSQLModal()">View SQL →</span>
    </div>`;
}

async function renderConversations(convs) {
  const list = document.getElementById('contacts-list');
  if (!convs.length) {
    list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-faint);font-size:13px;">No conversations yet.<br>Start a new chat ✏️</div>`;
    return;
  }
  // Fetch all participant profiles
  const otherIds = convs.map(c => c.participant1===currentUser.id ? c.participant2 : c.participant1);
  const { data: profiles } = await sb.from('profiles').select('*').in('id', [...new Set(otherIds)]);
  const profileMap = {};
  (profiles||[]).forEach(p => profileMap[p.id] = p);

  list.innerHTML = '';
  for (const conv of convs) {
    const otherId = conv.participant1===currentUser.id ? conv.participant2 : conv.participant1;
    const profile = profileMap[otherId] || { display_name: 'Unknown', email: '' };
    const name = profile.display_name || profile.email;
    const initial = name[0]?.toUpperCase() || '?';
    const preview = conv.last_message || (conv.last_image ? '📷 Image' : 'Start chatting');
    const time = conv.updated_at ? timeAgo(conv.updated_at) : '';
    const isActive = currentConversation?.id === conv.id;
    const div = document.createElement('div');
    div.className = `contact-item${isActive?' active':''}`;
    div.dataset.convId = conv.id;
    div.innerHTML = `
      <div class="avatar" style="width:42px;height:42px;font-size:16px">${initial}</div>
      <div class="contact-meta">
        <div class="contact-name">${escHtml(name)}</div>
        <div class="contact-preview">${escHtml(preview)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="contact-time">${time}</span>
      </div>`;
    div.onclick = () => openConversation(conv, profile);
    list.appendChild(div);
  }
}

// ── MOBILE NAV ──
function goBackToSidebar() {
  document.querySelector('.sidebar').classList.remove('hidden');
}

function hideSidebarOnMobile() {
  if (window.innerWidth <= 680) {
    document.querySelector('.sidebar').classList.add('hidden');
  }
}

// ── OPEN CONVERSATION ──
async function openConversation(conv, profile) {
  currentConversation = conv;
  hideSidebarOnMobile();
  // Update active state
  document.querySelectorAll('.contact-item').forEach(el => {
    el.classList.toggle('active', el.dataset.convId === conv.id);
  });
  const name = profile.display_name || profile.email;
  document.getElementById('chat-placeholder').style.display = 'none';
  const cv = document.getElementById('chat-view');
  cv.style.display = 'flex';
  cv.style.flexDirection = 'column';
  cv.style.flex = '1';
  cv.style.height = '100%';
  cv.style.overflow = 'hidden';
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-status').textContent = profile.email;
  document.getElementById('chat-avatar').textContent = name[0]?.toUpperCase() || '?';
  await loadMessages(conv.id);
  subscribeToMessages(conv.id);
}

// ── MESSAGES ──
async function loadMessages(convId) {
  const { data, error } = await sb.from('messages')
    .select('*')
    .eq('conversation_id', convId)
    .order('created_at', { ascending: true });
  if (error) { console.error(error); return; }
  renderMessages(data || []);
}

function renderMessages(msgs) {
  const area = document.getElementById('messages-area');
  area.innerHTML = '';
  let lastDate = '';
  let lastSender = '';
  let groupEl = null;

  for (const msg of msgs) {
    const d = new Date(msg.created_at);
    const dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    if (dateStr !== lastDate) {
      lastDate = dateStr;
      lastSender = '';
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dateStr;
      area.appendChild(div);
    }
    const isMe = msg.sender_id === currentUser.id;
    const side = isMe ? 'me' : 'them';
    if (msg.sender_id !== lastSender) {
      groupEl = document.createElement('div');
      groupEl.className = `msg-group ${side}`;
      area.appendChild(groupEl);
      lastSender = msg.sender_id;
    }
    const bubble = document.createElement('div');
    if (msg.image_url) {
      bubble.className = 'bubble image-bubble';
      bubble.innerHTML = `<img src="${escHtml(msg.image_url)}" alt="Image" loading="lazy" onclick="openLightbox('${escHtml(msg.image_url)}')" />`;
    } else {
      bubble.className = 'bubble';
      bubble.textContent = msg.content;
    }
    groupEl.appendChild(bubble);

    if (msgs.indexOf(msg) === msgs.length-1 || msgs[msgs.indexOf(msg)+1]?.sender_id !== msg.sender_id) {
      const timeEl = document.createElement('div');
      timeEl.className = 'bubble-time';
      timeEl.textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      groupEl.appendChild(timeEl);
    }
  }
  scrollToBottom();
}

function appendMessage(msg) {
  const area = document.getElementById('messages-area');
  const isMe = msg.sender_id === currentUser.id;
  const side = isMe ? 'me' : 'them';
  const d = new Date(msg.created_at);

  let groupEl = area.querySelector(`.msg-group.${side}:last-of-type`);
  const lastGroup = area.lastElementChild;
  const needsNewGroup = !lastGroup || !lastGroup.classList.contains('msg-group') || !lastGroup.classList.contains(side);
  if (needsNewGroup) {
    groupEl = document.createElement('div');
    groupEl.className = `msg-group ${side}`;
    area.appendChild(groupEl);
  } else {
    groupEl = lastGroup;
  }

  const bubble = document.createElement('div');
  if (msg.image_url) {
    bubble.className = 'bubble image-bubble';
    bubble.innerHTML = `<img src="${escHtml(msg.image_url)}" alt="Image" loading="lazy" onclick="openLightbox('${escHtml(msg.image_url)}')" />`;
  } else {
    bubble.className = 'bubble';
    bubble.textContent = msg.content;
  }
  groupEl.appendChild(bubble);

  const timeEl = document.createElement('div');
  timeEl.className = 'bubble-time';
  timeEl.textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  groupEl.appendChild(timeEl);
  scrollToBottom();
}

// ── SEND MESSAGE ──
async function sendMessage() {
  if (!currentConversation) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !selectedFile) return;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;

  let imageUrl = null;
  if (selectedFile) {
    imageUrl = await uploadImage(selectedFile);
    if (!imageUrl) { sendBtn.disabled = false; return; }
    clearImagePreview();
  }

  const { error } = await sb.from('messages').insert({
    conversation_id: currentConversation.id,
    sender_id: currentUser.id,
    content: text || null,
    image_url: imageUrl
  });

  if (!error) {
    input.value = '';
    input.style.height = '';
    // Update conversation last_message
    await sb.from('conversations').update({
      last_message: imageUrl ? null : text,
      last_image: imageUrl ? true : null,
      updated_at: new Date().toISOString()
    }).eq('id', currentConversation.id);
    await loadConversations();
  } else {
    showToast('Failed to send message', 'error');
  }
  sendBtn.disabled = false;
}

// ── IMAGE UPLOAD ──
async function uploadImage(file) {
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('chat-images').upload(path, file, { contentType: file.type });
  if (error) {
    // Try to use base64 embedded URL as fallback
    showToast('Storage bucket not set up. Using inline image.', 'error');
    return selectedFileDataURL; // fallback to data URL
  }
  const { data } = sb.storage.from('chat-images').getPublicUrl(path);
  return data.publicUrl;
}

// ── FILE SELECT ──
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please select an image file', 'error'); return; }
  if (file.size > 10 * 1024 * 1024) { showToast('Image must be under 10MB', 'error'); return; }
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    selectedFileDataURL = e.target.result;
    document.getElementById('preview-thumb').src = e.target.result;
    document.getElementById('preview-info').textContent = `${file.name} (${(file.size/1024).toFixed(0)} KB)`;
    document.getElementById('image-preview-bar').classList.add('show');
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function clearImagePreview() {
  selectedFile = null;
  selectedFileDataURL = null;
  document.getElementById('preview-thumb').src = '';
  document.getElementById('image-preview-bar').classList.remove('show');
}

// ── REALTIME ──
function subscribeToMessages(convId) {
  if (messageSubscription) sb.removeChannel(messageSubscription);
  messageSubscription = sb.channel(`messages:${convId}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `conversation_id=eq.${convId}`
    }, payload => {
      if (payload.new.sender_id !== currentUser.id) appendMessage(payload.new);
    })
    .subscribe();
}

function subscribeToAllMessages() {
  sb.channel('all-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async () => {
      await loadConversations();
    })
    .subscribe();
}

// ── NEW CHAT ──
function openNewChat() { document.getElementById('new-chat-modal').style.display = 'flex'; }
function closeNewChat(e) {
  if (!e || e.target === document.getElementById('new-chat-modal')) {
    document.getElementById('new-chat-modal').style.display = 'none';
    document.getElementById('new-chat-error').textContent = '';
    document.getElementById('new-chat-email').value = '';
  }
}

async function startNewChat() {
  const email = document.getElementById('new-chat-email').value.trim().toLowerCase();
  if (!email) return (document.getElementById('new-chat-error').textContent = 'Enter an email.');
  if (email === currentUser.email) return (document.getElementById('new-chat-error').textContent = 'Cannot chat with yourself.');
  document.getElementById('new-chat-error').textContent = 'Searching…';

  // Find user by email
  const { data: profiles, error } = await sb.from('profiles').select('*').eq('email', email).limit(1);
  if (error || !profiles?.length) {
    document.getElementById('new-chat-error').textContent = 'User not found. They must sign up first.';
    return;
  }
  const otherUser = profiles[0];
  const uid = currentUser.id;
  const oid = otherUser.id;

  // Check if conversation already exists
  const { data: existing } = await sb.from('conversations').select('*')
    .or(`and(participant1.eq.${uid},participant2.eq.${oid}),and(participant1.eq.${oid},participant2.eq.${uid})`)
    .limit(1);

  let conv;
  if (existing?.length) {
    conv = existing[0];
  } else {
    const { data: newConv, error: convErr } = await sb.from('conversations').insert({
      participant1: uid, participant2: oid, updated_at: new Date().toISOString()
    }).select().single();
    if (convErr) { document.getElementById('new-chat-error').textContent = 'Could not create conversation: ' + convErr.message; return; }
    conv = newConv;
  }

  closeNewChat();
  await loadConversations();
  await openConversation(conv, otherUser);
}

// ── SEARCH ──
function filterContacts(q) {
  document.querySelectorAll('.contact-item').forEach(el => {
    const name = el.querySelector('.contact-name')?.textContent.toLowerCase() || '';
    const preview = el.querySelector('.contact-preview')?.textContent.toLowerCase() || '';
    el.style.display = (name.includes(q.toLowerCase()) || preview.includes(q.toLowerCase())) ? '' : 'none';
  });
}

// ── INPUT HELPERS ──
function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── LIGHTBOX ──
function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

// ── SQL SETUP MODAL ──
function showSQLModal() {
  const sql = `-- Run this in Supabase SQL Editor:
-- 1. Profiles
create table if not exists profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text unique not null,
  display_name text,
  created_at timestamptz default now()
);
alter table profiles enable row level security;
create policy "Public profiles" on profiles for select using (true);
create policy "Own profile" on profiles for insert with check (auth.uid() = id);
create policy "Update own" on profiles for update using (auth.uid() = id);

-- 2. Conversations
create table if not exists conversations (
  id uuid primary key default gen_random_uuid(),
  participant1 uuid references profiles(id),
  participant2 uuid references profiles(id),
  last_message text,
  last_image boolean,
  updated_at timestamptz default now(),
  created_at timestamptz default now()
);
alter table conversations enable row level security;
create policy "Own conversations" on conversations for select
  using (auth.uid() = participant1 or auth.uid() = participant2);
create policy "Create conversations" on conversations for insert
  with check (auth.uid() = participant1 or auth.uid() = participant2);
create policy "Update conversations" on conversations for update
  using (auth.uid() = participant1 or auth.uid() = participant2);

-- 3. Messages
create table if not exists messages (
  id uuid primary key default gen_random_uuid(),
  conversation_id uuid references conversations(id) on delete cascade,
  sender_id uuid references profiles(id),
  content text,
  image_url text,
  created_at timestamptz default now()
);
alter table messages enable row level security;
create policy "Read messages" on messages for select using (
  exists (select 1 from conversations c where c.id = conversation_id
    and (c.participant1 = auth.uid() or c.participant2 = auth.uid()))
);
create policy "Send messages" on messages for insert with check (auth.uid() = sender_id);

-- 4. Storage bucket for images
insert into storage.buckets (id, name, public) values ('chat-images', 'chat-images', true)
  on conflict do nothing;
create policy "Upload images" on storage.objects for insert
  with check (bucket_id = 'chat-images' and auth.uid() is not null);
create policy "View images" on storage.objects for select
  using (bucket_id = 'chat-images');`;
  
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.onclick = () => document.body.removeChild(modal);
  modal.innerHTML = `<div class="modal" style="max-width:600px" onclick="event.stopPropagation()">
    <h3>📋 Supabase SQL Setup</h3>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Copy and run this in your Supabase Dashboard → SQL Editor</p>
    <textarea readonly style="width:100%;height:280px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11px;color:var(--text-muted);font-family:monospace;resize:none;outline:none">${sql}</textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="this.closest('.modal-overlay').remove()">Close</button>
      <button class="btn-primary" style="margin:0" onclick="navigator.clipboard.writeText(this.closest('.modal').querySelector('textarea').value);showToast('SQL copied!','success')">Copy SQL</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

// ── UTILS ──
function scrollToBottom() {
  const area = document.getElementById('messages-area');
  setTimeout(() => area.scrollTop = area.scrollHeight, 50);
}
function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff/60) + 'm';
  if (diff < 86400) return Math.floor(diff/3600) + 'h';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type='') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span> ${escHtml(msg)}`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.4s'; setTimeout(()=>t.remove(),400); }, 3000);
}
</script>
